<script>
  let currentUser = null, fullInventory = [], cart = [], currentOrderId = "";
  let verificationRetries = 0;
  let isGiftOrder = false;
  let isKitchenOrder = false;
  let isCashOrder = false;
  let salesDiscountEnabled = false;
  let manualPaymentMode = null;
  let vkPaymentMode = null;
  let manualTxnId = null;
  let verificationTimer = null;
  let pollInterval = null;
  const TOTAL_WAIT_TIME = 60; // 60 Seconds Timer
  let timeRemaining = TOTAL_WAIT_TIME;
  let pendingCartBackup = [];

  // Global State for Sales Mode

  const successModal = new bootstrap.Modal(document.getElementById('successModal'));

  function showAlert(message, type = 'success') {
    const toastContainer = document.getElementById('custom-toast');
    const toastMsg = document.getElementById('toast-msg');

    // Reset classes
    toastMsg.classList.remove('alert-vg-success', 'alert-danger');

    // Apply class based on type
    if (type === 'error') {
      toastMsg.classList.add('alert-danger');
    } else {
      toastMsg.classList.add('alert-vg-success');
    }

    toastMsg.innerText = message;
    toastContainer.style.display = 'block';

    setTimeout(() => {
      toastContainer.style.display = 'none';
    }, 3000);
  }

  window.onload = () => {
    // 1. Run data fetch first
    loadInitialData();

    // 2. Then set up listeners
    const loginForm = document.getElementById('login-form-container');
    if (loginForm) {
      loginForm.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doLogin();
      });
    }

    document.addEventListener('input', function (e) {
      // Listen for changes/typing in the UTR last 4 digits field
      if (e.target && e.target.id === 'utr-last4-input') {
        const submitUtrBtn = document.getElementById('submit-utr-btn');
        const utrValue = e.target.value.trim();

        // Enable the button only when exactly 4 digits/characters are entered
        if (utrValue.length === 4) {
          if (submitUtrBtn) {
            submitUtrBtn.classList.remove('disabled');
            submitUtrBtn.disabled = false;
            submitUtrBtn.style.setProperty("background-color", "var(--vg-brown)", "important");
          }
        } else {
          if (submitUtrBtn) {
            submitUtrBtn.classList.add('disabled');
            submitUtrBtn.disabled = true;
          }
        }
      }
    });

    // Add this inside window.onload in scripts.html
    const searchBar = document.getElementById('search-bar');
    if (searchBar) {
      searchBar.addEventListener('keypress', (e) => {
        // 13 is the 'Enter' key, which almost all barcode guns send after a scan
        if (e.key === 'Enter') {
          const sku = searchBar.value.trim();
          if (sku.length > 2) {
            handleScannedItem(sku); // Reusing your existing logic
            searchBar.value = "";   // CLEAR for next item immediately
            e.preventDefault();     // Prevent form submission/refresh
          }
        }
      });
    }

  };

  function loadInitialData() {
    const v = document.getElementById('varga');
    const n = document.getElementById('name');
    v.disabled = true;
    v.innerHTML = '<option value="">Loading Varga...</option>';
    n.disabled = true;
    n.innerHTML = '<option value="">Select Varga first</option>';
    google.script.run.withSuccessHandler(vargas => {
      v.innerHTML = '<option value="">Select Varga</option>';
      vargas.forEach(item => v.add(new Option(item, item)));
      v.disabled = false;
    }).getVargas();
  }

  function fetchNames() {
    const v = document.getElementById('varga').value;
    const n = document.getElementById('name');
    if (!v) {n.innerHTML = '<option value="">Select Varga first</option>'; n.disabled = true; return;}
    n.disabled = true;
    n.innerHTML = '<option value="">Loading names...</option>';
    google.script.run.withSuccessHandler(names => {
      n.innerHTML = '<option value="">Select Name</option>';
      names.forEach(item => n.add(new Option(item, item)));
      n.disabled = false;
    }).getNamesByVarga(v);
  }

  function doLogin() {
    const m = document.getElementById('mobile').value;
    const loginBtn = document.getElementById('login-btn');

    // Basic Mobile Validation
    if (!m || m.length < 10) return showAlert("Enter a valid mobile number", "error");

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loader"></span> Authenticating...';

    // Helper to handle post-login setup
    const handleSuccessLogin = (res) => {
      currentUser = res;

      // Detect if logged in user is Kitchen
      const isKitchenUser = currentUser && currentUser.name && currentUser.name.toLowerCase().includes("kitchen");


      // Set global flag
      isKitchenOrder = isKitchenUser;

      /*Refresh wallet*/
      if (typeof fetchAndUpdateUserWallet === 'function') {
        fetchAndUpdateUserWallet(); // Fresh sync from sheet
      }


      // Start shopping UI session
      startShop();

      // Enable Kitchen toggle element if user is Kitchen
      setTimeout(() => {
        const kitchenToggle = document.getElementById('kitchen-order-toggle') || document.getElementById('kitchen-order-checkbox');
        if (kitchenToggle) {
          kitchenToggle.checked = isKitchenUser;
        }
      }, 100);
    };

    if (currentMode === 'guest') {
      // --- GUEST PATH ---
      const ev = document.getElementById('event').value;
      const month = document.getElementById('guest-month').value;
      const gn = document.getElementById('guest-name-input').value;
      const asc = document.getElementById('future-associate').checked;

      if (!ev || !month || !gn) {
        resetLoginBtn(loginBtn);
        return showAlert("Fill all guest fields", "error");
      }

      google.script.run.withSuccessHandler(res => {
        if (res.success) {handleSuccessLogin(res);}
        else {showAlert("Registration Failed", "error"); resetLoginBtn(loginBtn);}
      }).registerGuest(ev, month, gn, m, asc);

    } else {
      // --- PARENT PATH ---
      const v = document.getElementById('varga').value;
      const n = document.getElementById('name').value;

      if (!v || !n) {
        resetLoginBtn(loginBtn);
        return showAlert("Select Varga and Name", "error");
      }

      google.script.run.withSuccessHandler(res => {
        if (res.success) {handleSuccessLogin(res);}
        else {showAlert("Invalid Login Details", "error"); resetLoginBtn(loginBtn);}
      }).validateLogin(v, n, m);
    }
  }

  // Helper to clean up the button state on failure
  function resetLoginBtn(btn) {
    btn.disabled = false;
    btn.innerText = "Login";
  }

  function startShop() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('shop-section').classList.remove('hidden');
    document.getElementById('welcome-msg').innerText = "Namaste, " + currentUser.name;
    document.getElementById('disc-label').innerText = `Discount (${currentUser.discount}%):`;

    // NEW: Initialize the cart UI to show Balance and Credit immediately
    updateCartUI();

    // Trigger the initial data load
    refreshData();
  }

  function refreshData() {
    const refreshBtn = document.querySelector('.btn-vg-refresh');
    const icon = refreshBtn ? refreshBtn.querySelector('.material-icons') : null;

    // DO NOT clear cart array here so user items are preserved.

    // Start spin animation and disable button
    if (icon) icon.classList.add('spinning');
    if (refreshBtn) refreshBtn.disabled = true;

    const grid = document.getElementById('inventory-grid');
    grid.innerHTML = '<div class="col-12 text-center py-5"><span class="loader" style="border-color:var(--vg-brown); border-bottom-color:transparent;"></span> Loading Items...</div>';

    google.script.run.withSuccessHandler(data => {
      if (icon) icon.classList.remove('spinning');
      if (refreshBtn) refreshBtn.disabled = false;

      // Check if store is closed
      if (!data || data.length === 0) {
        grid.innerHTML = `
          <div class="col-12">
            <div class="empty-store-banner">
              <div class="empty-store-icon"><i class="material-icons" style="font-size: 80px;">hourglass_empty</i></div>
              <div class="empty-store-title"><span class="decorative-leaf">🌿</span> Preparation in Progress</div>
              <div class="empty-store-text">
                Please wait till <strong>Vidyagrama</strong> opens the cart.
              </div>
            </div>
          </div>`;

        document.querySelector('.row.g-2.mb-3').classList.add('hidden');
        document.getElementById('cart-sidebar').style.opacity = "0.5";
        document.getElementById('cart-sidebar').style.pointerEvents = "none";
        return;
      }

      // Normal flow
      document.querySelector('.row.g-2.mb-3').classList.remove('hidden');
      document.getElementById('cart-sidebar').style.opacity = "1";
      document.getElementById('cart-sidebar').style.pointerEvents = "auto";

      fullInventory = data;

      // OPTIONAL: Sync/Revalidate cart items with new inventory prices/data
      if (cart && cart.length > 0) {
        cart.forEach(cartItem => {
          const freshItem = fullInventory.find(inv => String(inv.id || inv.itemName) === String(cartItem.id || cartItem.itemName));
          if (freshItem) {
            cartItem.salePrice = freshItem.salePrice; // Update price if changed in sheet
          }
        });
        updateCartUI(); // Refresh UI with retained items
      }

      const mainCatFilter = document.getElementById('main-cat-filter');
      mainCatFilter.innerHTML = '<option value="All">All Inventories</option>';

      const mainCats = [...new Set(data.map(i => i.mainCategory))].sort();
      mainCats.forEach(c => {
        mainCatFilter.add(new Option(toTitleCase(c), c));
      });

      updateSubCategoryDropdown();
      if (currentUser) showAlert("Inventory refreshed! Your cart is retained 🌿", "success");

    }).getInventoryData();
  }

  function updateSubCategoryDropdown() {
    const selectedMain = document.getElementById('main-cat-filter').value;
    const subCatFilter = document.getElementById('sub-cat-filter');
    subCatFilter.innerHTML = '<option value="All">All Sub-Categories</option>';
    const relevantItems = selectedMain === "All" ? fullInventory : fullInventory.filter(i => i.mainCategory === selectedMain);
    const subCats = [...new Set(relevantItems.map(i => i.subCategory))].filter(c => c).sort();
    subCats.forEach(sc => subCatFilter.add(new Option(sc, sc)));
    filterItems();
  }

  function filterItems() {
    const searchBar = document.getElementById('search-bar');
    const mainCatFilter = document.getElementById('main-cat-filter');
    const subCatFilter = document.getElementById('sub-cat-filter');
    const shortageToggle = document.getElementById('shortage-toggle');

    // Safety: If elements aren't loaded yet, don't run
    if (!searchBar || !mainCatFilter || !subCatFilter) return;

    const searchTerm = searchBar.value.toLowerCase();
    const mainCat = mainCatFilter.value;
    const subCat = subCatFilter.value;
    const shortageOnly = shortageToggle ? shortageToggle.checked : false;

    const filtered = fullInventory.filter(i => {
      // 1. Search Filter
      const matchesSearch = i.itemName.toLowerCase().includes(searchTerm) ||
        (i.sku && i.sku.toLowerCase().includes(searchTerm));

      // 2. Category Filters
      const matchesMain = (mainCat === 'All' || i.mainCategory === mainCat);
      const matchesSub = (subCat === 'All' || i.subCategory === subCat);

      // 3. Shortage Filter (The Logic Fix)
      // Convert to number; default to 0 if empty/null
      const stockLevel = parseFloat(i.stock) || 0;
      const isShortageItem = stockLevel <= 5;

      const matchesShortage = shortageOnly ? isShortageItem : true;
      //console.log("Item:", i.itemName, "Stock:", stockLevel, "Is Shortage:", isShortageItem);

      return matchesSearch && matchesMain && matchesSub && matchesShortage;
    });

    renderInventory(filtered);
  }

 function renderInventory(items) {
  const grid = document.getElementById('inventory-grid');

  if (items.length === 0) {
    grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No items found matching your filters.</div>';
    return;
  }

  grid.innerHTML = items.map(i => {
    const itemMoq = i.moq || 0.5;
    const formattedBadge = toTitleCase(i.mainCategory);

    return `
    <div class="col-6 col-md-4">
      <div class="item-card p-2 text-center d-flex flex-column shadow-sm h-100" style="position:relative;">
        <div class="text-end">
          <span class="badge bg-light border" style="font-size:0.6rem; color:var(--vg-brown)">
            ${formattedBadge}
          </span>
        </div>
        <img src="${i.imageUrl}" class="item-img rounded mb-2" onerror="this.src='https://dummyimage.com/150/633a11/ffffff.png&text=Vidyagrama'">
        <div class="small fw-bold text-truncate">${i.itemName}</div>
        <div class="text-muted" style="font-size: 0.65rem;">SKU: ${i.sku}</div>
        <div class="small mb-1" style="color:var(--vg-brown)">₹${parseFloat(i.salePrice).toFixed(2)} / ${i.uom}</div>
        <div class="mt-auto">
          <div class="d-flex gap-1">
            <input type="number" id="qty-${i.sku}" class="form-control form-control-sm" value="${itemMoq}" min="${itemMoq}" step="0.1">
            <button id="btn-${i.sku}" class="btn btn-sm btn-success w-100" onclick="addToCart('${i.sku}')">
              Add
            </button>
          </div>
          <span class="moq-label">Min: ${itemMoq} ${i.uom}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

  function addToCart(sku) {
    const item = fullInventory.find(i => i.sku === sku);
    const qtyInput = document.getElementById('qty-' + sku);
    const addBtn = document.getElementById('btn-' + sku);
    if (!item) return showAlert("Item not found", "error");
    const qty = parseFloat(qtyInput.value);
    const minAllowed = item.moq || 0.5;
    if (isNaN(qty) || qty < minAllowed) {showAlert(`Minimum order is ${minAllowed} ${item.uom}`, "error"); return;}

    addBtn.classList.add('btn-clicked');
    addBtn.innerText = "Added!";

    const cartSidebar = document.getElementById('cart-sidebar');
    cartSidebar.classList.remove('cart-updated');
    void cartSidebar.offsetWidth;
    cartSidebar.classList.add('cart-updated');

    setTimeout(() => {
      addBtn.classList.remove('btn-clicked');
      addBtn.innerText = "Add";
    }, 600);

    const existingItem = cart.find(cartItem => cartItem.sku === sku);
    if (existingItem) {
      existingItem.quantity = parseFloat((existingItem.quantity + qty).toFixed(2));
      existingItem.fullSubtotal = (existingItem.quantity * parseFloat(existingItem.salePrice)).toFixed(2);
    } else {
      cart.push({...item, cartId: Date.now() + Math.random(), quantity: qty, fullSubtotal: (qty * parseFloat(item.salePrice)).toFixed(2)});
    }
    updateCartUI();
  }

  function removeFromCart(id) {cart = cart.filter(i => i.cartId !== id); updateCartUI();}

  /**** Change cart Quantity *****/
  function changeCartQty(sku, direction) {
    const itemInCart = cart.find(i => i.sku === sku); if (!itemInCart) return;
    const step = 1, minAllowed = itemInCart.moq || 0.5;
    if (direction === 1) {itemInCart.quantity = parseFloat((itemInCart.quantity + step).toFixed(2));}
    else {
      if (itemInCart.quantity - step < minAllowed) {showAlert(`Min order is ${minAllowed} ${itemInCart.uom}`, "error"); itemInCart.quantity = minAllowed;}
      else {itemInCart.quantity = parseFloat((itemInCart.quantity - step).toFixed(2));}
    }
    itemInCart.fullSubtotal = (itemInCart.quantity * parseFloat(itemInCart.salePrice)).toFixed(2);
    updateCartUI();
  }

  /*Reset completely so that next user can logout with fresh data*/
  function hardReset() {
    // 1. Reset Global Data Variables
    cart = [];
    currentUser = null;
    fullInventory = [];

    // 2. Clear UI Containers & Inputs
    document.getElementById('shop-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');

    const guestNameInput = document.getElementById('guest-name-input');
    const eventSelect = document.getElementById('event');
    const associateCheck = document.getElementById('future-associate');

    if (guestNameInput) guestNameInput.value = "";
    if (eventSelect) eventSelect.selectedIndex = 0;
    if (associateCheck) associateCheck.checked = false;

    document.getElementById('mobile').value = "";
    document.getElementById('order-notes').value = "";
    document.getElementById('search-bar').value = "";
    document.getElementById('inventory-grid').innerHTML = "";
    document.getElementById('main-cat-filter').innerHTML = '<option value="All">All Inventories</option>';
    document.getElementById('sub-cat-filter').innerHTML = '<option value="All">All Sub-Categories</option>';
    document.getElementById('welcome-msg').innerText = "";

    // 3. Reset Buttons & Overlay UI
    clearVerificationTimers();
    const overlay = document.getElementById('payment-verify-overlay');
    if (overlay) overlay.style.display = 'none';

    const utrInput = document.getElementById('utr-last4-input');
    if (utrInput) utrInput.value = '';

    const loginBtn = document.getElementById('login-btn');
    if (loginBtn) {
      loginBtn.disabled = false;
      loginBtn.innerText = "Login";
    }

    // 4. Reset Cart Sidebar
    updateCartUI();

    const filterRow = document.querySelector('.row.g-2.mb-3');
    if (filterRow) filterRow.classList.remove('hidden');

    const sidebar = document.getElementById('cart-sidebar');
    if (sidebar) {
      sidebar.style.opacity = "1";
      sidebar.style.pointerEvents = "auto";
    }

    // 5. Reload Initial Data
    loadInitialData();
  }

  function softReset() {
    // 1. Clear Data
    cart = [];

    // 2. Clear UI Inputs
    document.getElementById('order-notes').value = "";
    document.getElementById('search-bar').value = "";
    const utrInput = document.getElementById('utr-last4-input');
    if (utrInput) utrInput.value = "";

    // 3. Reset Overlay UI
    clearVerificationTimers();
    const overlay = document.getElementById('payment-verify-overlay');
    if (overlay) overlay.style.display = 'none';

    // 4. Update UI & Focus Search
    updateCartUI();
    filterItems();

    const searchBar = document.getElementById('search-bar');
    if (searchBar) searchBar.focus();
  }

  function toTitleCase(str) {
    if (!str) return "General"; // Fallback for empty categories
    return str.toString().toLowerCase().split(' ').map(word => {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }).join(' ');
  }

  function initiatePayment(method) {
    if (!currentUser) return;

    const finalValEl = document.getElementById('final-val');
    if (!finalValEl) return;

    const amount = parseFloat(finalValEl.innerText.replace(/[₹,]/g, '').trim()) || 0;
    const isSales = (currentUser.varga === "Sales");

    // 1. Handle Gift Orders immediately
    if (isGiftOrder && amount === 0) {
      showGiftConfirmation();
      return;
    }

    // 2. Clear the main inventory grid for the "Checkout Screen"
    const grid = document.getElementById('inventory-grid');
    if (!grid) return;

    if (method === 'CASH' && isSales) {
      renderCashScreen(grid, amount);
    } else {
      renderUPIScreen(grid, amount);
    }

  }

  function renderCashScreen(container, amount) {
    container.innerHTML = `
        <div class="col-12 animate__animated animate__fadeIn">
            <div class="card border-0 shadow-lg text-center overflow-hidden" style="border-radius: 15px;">
                <div class="bg-success py-3 text-white">
                    <i class="material-icons" style="font-size: 3rem;">payments</i>
                    <h5 class="mb-0 fw-bold">Cash Collection</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-1">Total Amount to Collect</p>
                    <h2 class="display-5 fw-bold text-dark mb-4">₹${amount.toFixed(2)}</h2>
                    
                    <div class="p-3 bg-light rounded mb-4 border">
                        <p class="small text-muted mb-0">Please verify the currency notes before confirming.</p>
                    </div>

                    <button class="btn btn-success btn-lg w-100 py-3 fw-bold shadow" 
                            onclick="processCashOrder(${amount})">
                        CONFIRM CASH RECEIVED
                    </button>
                    
                    <button class="btn btn-link text-muted mt-3" onclick="filterItems()">
                        <i class="material-icons align-middle" style="font-size:18px;">arrow_back</i> Cancel & Go Back
                    </button>
                </div>
            </div>
        </div>`;
  }

  function renderUPIScreen(container, amount) {
    if (!container) return;

    // Safety check for amount
    const validAmount = parseFloat(amount) || 0;
    const upiId = "gokripa@icici";
    const amountFixed = validAmount.toFixed(2);
    const upiUrl = "upi://pay?pa=" + upiId + "&pn=Vidyakshetra&am=" + amountFixed + "&cu=INR";
    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(upiUrl);

    // Using a cleaner template literal structure
    container.innerHTML = `
        <div class="col-12 text-center py-4 bg-white shadow rounded border-top border-warning border-4">
          <h5 class="fw-bold mb-3" style="color: var(--vg-brown);">Complete Your Payment</h5>
          
          <div class="mb-3">
            <img src="${qrUrl}" class="img-fluid border p-2 bg-light" style="max-width: 200px;" alt="Scan to Pay">
            <p class="small text-muted mt-2">Scan this QR code with any UPI app (GPay, PhonePe, etc.)</p>
          </div>

          <div class="px-4">
            <div class="alert alert-secondary py-2 mb-3">
              <small class="d-block text-muted">Amount to Pay:</small>
              <strong class="h4" style="color: var(--vg-brown);">₹${amountFixed}</strong>
            </div>

            <p class="small text-muted mb-2">Or copy the UPI ID below:</p>
            <div class="input-group mb-3">
              <input type="text" id="upi-copy-target" class="form-control text-center bg-light" value="${upiId}" readonly>
              <button class="btn" style="background-color: var(--vg-brown); color: white;" onclick="copyUpiId()">Copy ID</button>
            </div>
            
            <div class="d-grid gap-2 mt-4">
              <button class="btn btn-outline-secondary btn-sm" onclick="filterItems()">Back to Items</button>
            </div>
          </div>
        </div>`;

    // Verification sidebar logic
    const verifyBox = document.getElementById('verify-box');
    if (verifyBox) {
      verifyBox.style.display = 'block';
    }
  }
  // Add this function to your <script> to make the Copy button work
  function copyUpiId() {
    const copyText = document.getElementById("upi-copy-target");
    copyText.select();
    copyText.setSelectionRange(0, 99999); // For mobile
    navigator.clipboard.writeText(copyText.value);

    showAlert("UPI ID Copied! Paste it in your Payment App.", "success");
  }

  /***********************Logout Model **********************************/
  // Global variable for the modal instance
  const logoutModal = new bootstrap.Modal(document.getElementById('logoutModal'));

  function showLogoutConfirmation() {
    logoutModal.show();
  }

  function confirmLogout() {
    // 1. Hide the modal
    logoutModal.hide();

    // 2. Log activity (using the name from your currentUser object)
    if (currentUser) {
      google.script.run.logActivity(
        currentUser.name,
        "LOGOUT",
        "User manually signed out",
        "Shop_UI"
      );
    }

    // 3. Show a friendly toast
    showAlert("Logging out... Namaste! 🌿", "success");

    // 4. Trigger your existing cleanup
    setTimeout(() => {
      hardReset();
    }, 800);
  }

  /*For guest mode and parent mode*/
  let currentMode = 'parent';
  /* Toggle UI between guest and parent mode*/
  function toggleUserMode(mode) {
    currentMode = mode;
    const isGuest = (mode === 'guest');

    // 1. Toggle visibility
    document.getElementById('parent-only-fields').style.display = isGuest ? 'none' : 'block';
    document.getElementById('guest-only-fields').style.display = isGuest ? 'block' : 'none';
    document.getElementById('guest-association').style.display = isGuest ? 'block' : 'none';

    // 2. CLEAR PREVIOUS DATA
    // Reset shared fields
    document.getElementById('mobile').value = "";

    // Reset Parent fields (if they exist in your DOM)
    const vargaSelect = document.getElementById('varga');
    const nameSelect = document.getElementById('name');
    if (vargaSelect) vargaSelect.selectedIndex = 0;
    if (nameSelect) {
      nameSelect.innerHTML = '<option value="">Select Varga first</option>';
      nameSelect.disabled = true;
    }

    // Reset Guest fields
    document.getElementById('guest-name-input').value = "";
    const eventSelect = document.getElementById('event');
    if (eventSelect) eventSelect.selectedIndex = 0;

    // Reset Checkbox
    document.getElementById('future-associate').checked = false;

    // 3. Load events if switching to Guest mode
    if (isGuest) {
      loadGuestEvents();
    }
  }

  /* Load guest events*/
  function loadGuestEvents() {
    const eventSelect = document.getElementById('event');
    eventSelect.innerHTML = '<option value="">Loading events...</option>';

    google.script.run.withSuccessHandler(function (events) {
      eventSelect.innerHTML = '<option value="">Select Event</option>';
      events.forEach(function (ev) {
        const opt = document.createElement('option');
        opt.value = ev;
        opt.textContent = ev;
        eventSelect.appendChild(opt);
      });
    }).getEventList(); // This needs to be added to your Code.gs
  }

  /******************************* Adding Items to Cart via Barcode Scanner *************************************/
  let html5QrCode;
  let isScanning = false;
  let audioCtx;

  async function startScanner() {
    if (isScanning) return;
    isScanning = true;

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    document.getElementById('scanner-wrapper').style.display = 'block';

    if (html5QrCode) {
      try {await html5QrCode.clear();} catch (e) { }
    }

    html5QrCode = new Html5Qrcode("reader");

    const qrConfig = {
      fps: 30,
      qrbox: {width: 280, height: 120},
      aspectRatio: 1.777778,
      formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128],
      experimentalFeatures: {useBarCodeDetectorIfSupported: true}
    };

    html5QrCode.start(
      {facingMode: "environment"},
      qrConfig,
      (txt) => {
        if (txt.length > 2) {
          handleScannedItem(txt); // Calls our new logic above
          stopScanner();
          isScanning = false;
        }
      }
    ).catch(err => {
      isScanning = false;
      console.error("Camera Error:", err);
      alert("Camera could not start. Please check permissions.");
      document.getElementById('scanner-wrapper').style.display = 'none';
    });
  }

  function handleScannedItem(sku) {
    const item = fullInventory.find(i => i.sku === sku);

    if (item) {
      const minQty = item.moq || 0.5;
      const qtyInput = document.getElementById('qty-' + sku);

      // Physical Feedback
      if ("vibrate" in navigator) navigator.vibrate(100);
      playBeep();

      if (qtyInput) {
        qtyInput.value = minQty;
        addToCart(sku);
      } else {
        addDirectlyToCart(item, minQty);
      }

      // PROFESSIONAL TOUCH: Clear the search bar every time an item is found
      // This ensures that even if you scanned via camera, the search text is wiped
      const searchBar = document.getElementById('search-bar');
      if (searchBar) {
        searchBar.value = "";
        filterItems(); // Reset the grid to show all items again
      }

      showAlert(`Added ${minQty} ${item.uom || ''} of ${item.itemName}`, "success");
    } else {
      // Double vibrate on error
      if ("vibrate" in navigator) navigator.vibrate([50, 100, 50]);
      showAlert("Barcode not recognized: " + sku, "error");

      // Clear search even on error so they can try again
      const searchBar = document.getElementById('search-bar');
      if (searchBar) searchBar.value = "";
    }
  }

  // Helper for when the item isn't rendered in the current filtered list
  function addDirectlyToCart(item, qty) {
    const existingItem = cart.find(cartItem => cartItem.sku === item.sku);
    if (existingItem) {
      existingItem.quantity = parseFloat((existingItem.quantity + qty).toFixed(2));
      existingItem.fullSubtotal = (existingItem.quantity * parseFloat(existingItem.salePrice)).toFixed(2);
    } else {
      cart.push({
        ...item,
        cartId: Date.now() + Math.random(),
        quantity: qty,
        fullSubtotal: (qty * parseFloat(item.salePrice)).toFixed(2)
      });
    }
    updateCartUI();

    // Animate the sidebar to show something happened
    const cartSidebar = document.getElementById('cart-sidebar');
    cartSidebar.classList.add('cart-updated');
    setTimeout(() => cartSidebar.classList.remove('cart-updated'), 600);
  }

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        document.getElementById('scanner-wrapper').style.display = 'none';
        isScanning = false;
      }).catch(err => console.error("Stop Error:", err));
    }
  }

  function playBeep() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  /***********************NE payment order status code***************************************************/

  // Global State Variables (Ensure these exist at top of script if not already)
  function startOrderProcess() {

    if (!cart || cart.length === 0) {
      if (typeof showAlert === "function") showAlert("Your cart is empty!", "error");
      return;
    }

    // Backup cart in case UI updates wipe global `cart`
    pendingCartBackup = JSON.parse(JSON.stringify(cart));

    const finalTotalStr = document.getElementById('final-val').innerText.replace(/[₹,]/g, '');
    const finalTotal = parseFloat(finalTotalStr) || 0;

    // 0. Skip verification for Cash / Gift / Kitchen / Zero Amount
    const isBypassRequired = finalTotal === 0 || isGiftOrder || isCashOrder || isKitchenOrder ||
      (typeof vkPaymentMode !== 'undefined' && (vkPaymentMode === "Cash" || vkPaymentMode === "Gift" || vkPaymentMode === "Kitchen"));

    if (isBypassRequired) {
      // Resolve payment mode name priority
      let targetMode = "Auto-Verified";
      if (isCashOrder || (typeof vkPaymentMode !== 'undefined' && vkPaymentMode === "Cash")) targetMode = "Cash";
      else if (isGiftOrder || (typeof vkPaymentMode !== 'undefined' && vkPaymentMode === "Gift")) targetMode = "Gift";
      else if (isKitchenOrder || (typeof vkPaymentMode !== 'undefined' && vkPaymentMode === "Kitchen")) targetMode = "Kitchen";

      executeFinalOrder(targetMode, "N/A");
      return;
    }

    // Render QR Overlay UI dynamically into step 1 container
    const upiId = "gokripa@icici";
    const amountFixed = finalTotal.toFixed(2);
    const upiUrl = "upi://pay?pa=" + upiId + "&pn=Vidyakshetra&am=" + amountFixed + "&cu=INR";
    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(upiUrl);

    const loadingStep = document.getElementById('pv-step-loading');
    if (loadingStep) {
      loadingStep.innerHTML =
        '<div class="text-center p-2">' +
        '<h5 class="fw-bold mb-2" style="color: var(--vg-brown, #5c3a21);">Scan to Pay</h5>' +
        '<div class="alert alert-light border py-2 mb-3 shadow-sm">' +
        '<small class="text-muted d-block">Amount Due</small>' +
        '<strong class="h3 fw-bold" style="color: var(--vg-brown, #5c3a21);">₹' + amountFixed + '</strong>' +
        '</div>' +
        '<div class="position-relative d-inline-block mb-3">' +
        '<img src="' + qrUrl + '" class="img-fluid border p-2 bg-white rounded shadow-sm" style="max-width: 180px;" alt="UPI QR Code">' +
        '</div>' +
        '<div class="input-group input-group-sm mb-3 mx-auto" style="max-width: 260px;">' +
        '<input type="text" id="upi-copy-target" class="form-control text-center bg-light" value="' + upiId + '" readonly>' +
        '<button class="btn" style="background-color: var(--vg-brown, #5c3a21); color: white;" onclick="copyUpiId()">Copy</button>' +
        '</div>' +
        '<div class="d-flex align-items-center justify-content-center gap-2 mb-2">' +
        '<span class="spinner-border spinner-border-sm text-warning" role="status"></span>' +
        '<span class="small fw-bold text-muted">Checking bank logs...</span>' +
        '</div>' +
        '<div class="progress mb-2" style="height: 6px;">' +
        '<div id="pv-progress-bar" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 100%;"></div>' +
        '</div>' +
        '<small class="text-muted"><strong id="pv-timer-text">Time remaining: ' + TOTAL_WAIT_TIME + 's</strong></small>' +
        '</div>';
    }

    // Show Overlay and reset display states
    document.getElementById('pv-step-loading').style.display = 'block';
    document.getElementById('pv-step-manual').style.display = 'none';
    document.getElementById('payment-verify-overlay').style.display = 'flex';

    timeRemaining = TOTAL_WAIT_TIME;
    clearVerificationTimers();

    // 1. CONTINUOUS BACKEND CHECK (Every 4 Seconds)
    pollInterval = setInterval(function () {

      google.script.run
        .withSuccessHandler(function (res) {

          if (!res) {
            return;
          }

          // RULE 1 MATCH: Found payment automatically!
          if (res.status === "SUCCESS") {
            clearVerificationTimers();
            executeFinalOrder("Auto-Verified", res.txnId);
          }
          // RULE 3 MATCH: Multiple parents paid same amount -> Prompt for 4-digit UTR immediately
          else if (res.status === "DUPLICATES") {
            clearVerificationTimers();
            showUtrInputStep("Multiple payments of ₹" + amountFixed + " found. Please enter the last 4 digits of your UTR.");
          }
          else if (res.status === "NOT_FOUND") {
            console.log("⏳ [POLLING_RESPONSE] No payment detected in SMS logs yet...");
          }
        })
        .withFailureHandler(function (err) {
          console.error("❌ [POLLING_ERROR] Google Script call failed:", err);
        })
        .autoCheckPayment(finalTotal, currentUser.name, "");
    }, 4000);

    // 2. 60-SECOND COUNTDOWN
    verificationTimer = setInterval(function () {
      timeRemaining--;
      updateProgressUI(timeRemaining, TOTAL_WAIT_TIME);

      // RULE 2: Timer reached 0s -> Ask for 4-digit UTR
      if (timeRemaining <= 0) {
        console.warn("⏰ [RULE_2_TIMEOUT] 60-second polling expired with no payment match. Triggering UTR Fallback step.");
        clearVerificationTimers();
        showUtrInputStep("Payment not auto-detected within 60s. Please enter the last 4 digits of your UTR to verify.");
      }
    }, 1000);
  }

  // Helper to switch to UTR input step cleanly
  function showUtrInputStep(message) {
    console.log("📌 [UI_SWITCH] Switching screen to manual UTR entry step. Reason:", message);
    document.getElementById('pv-step-loading').style.display = 'none';
    document.getElementById('pv-step-manual').style.display = 'block';

    const msgEl = document.getElementById('utr-help-msg');
    if (msgEl) msgEl.innerText = message;

    const utrInput = document.getElementById('utr-last4-input');
    if (utrInput) {
      utrInput.value = "";
      utrInput.focus();
    }
  }

  // Updates progress bar and countdown text
  function updateProgressUI(remaining, total) {
    const percentage = Math.max(0, Math.min(100, (remaining / total) * 100));
    const pBar = document.getElementById('pv-progress-bar');
    const tText = document.getElementById('pv-timer-text');

    if (pBar) pBar.style.width = percentage + "%";
    if (tText) tText.innerText = `Time remaining: ${remaining}s`;
  }

  // Clears running intervals safely
  function clearVerificationTimers() {
    if (pollInterval) clearInterval(pollInterval);
    if (verificationTimer) clearInterval(verificationTimer);
    pollInterval = null;
    verificationTimer = null;
  }

  // Cancel action inside overlay
  function cancelOrderProcess() {
    clearVerificationTimers();
    const overlay = document.getElementById('payment-verify-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  // Copy UPI ID helper
  function copyUpiId() {
    const copyText = document.getElementById("upi-copy-target");
    if (!copyText) return;

    copyText.select();
    copyText.setSelectionRange(0, 99999); // Mobile browser compatibility
    navigator.clipboard.writeText(copyText.value);

    if (typeof showAlert === "function") showAlert("UPI ID Copied to clipboard!", "success");
  }

  // Submit manual 4-digit UTR for fallback double-check
  function submitManualUTR() {
    const input = document.getElementById('utr-last4-input');
    const last4 = input ? input.value.trim() : "";
    const finalTotalStr = document.getElementById('final-val').innerText.replace(/[₹,]/g, '');
    const finalTotal = parseFloat(finalTotalStr) || 0;
    const btn = document.getElementById('submit-utr-btn');

    if (last4.length !== 4 || isNaN(last4)) {
      console.warn("⚠️ [UTR_SUBMIT] Invalid UTR entered:", last4);
      if (typeof showAlert === "function") showAlert("Please enter exactly 4 numeric digits.", "error");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Validating...';
    }

    // Validate UTR against backend logs using last4
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = "Submit & Place Order";
        }

        if (res && res.status === "SUCCESS") {
          clearVerificationTimers();
          executeFinalOrder("Auto-Verified", res.txnId);
        } else {
          clearVerificationTimers();
          executeFinalOrder("Manual UTR-4", "UTR-LAST4-" + last4);
        }
      })
      .withFailureHandler(function (e) {
        console.error("❌ [UTR_VALIDATE_ERROR] Server error during UTR check:", e);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = "Submit & Place Order";
        }
        clearVerificationTimers();
        executeFinalOrder("Manual UTR-4", "UTR-LAST4-" + last4);
      })
      .autoCheckPayment(finalTotal, currentUser.name, last4);
  }

  function executeFinalOrder(paymentMode, txnId) {

    // 1. Hide payment verification overlay
    const overlay = document.getElementById('payment-verify-overlay');
    if (overlay) overlay.style.display = 'none';

    // 2. Restore cart from backup if cleared prematurely
    if ((!cart || cart.length === 0) && pendingCartBackup.length > 0) {
      cart = JSON.parse(JSON.stringify(pendingCartBackup));
    }

    // 3. Update button state
    const btn = document.getElementById('place-order-btn');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Finalizing Order...';
    }

    // 4. Resolve payment mode & order notes explicitly
    let resolvedPaymentMode = paymentMode;
    let defaultNote = "";

    if (isGiftOrder || paymentMode === "Gift") {
      resolvedPaymentMode = "Gift";
      defaultNote = "Vidyakshetra Gift";
    } else if (isKitchenOrder || paymentMode === "Kitchen") {
      resolvedPaymentMode = "Kitchen";
      defaultNote = "Kitchen Order";
    } else if (isCashOrder || paymentMode === "Cash") {
      resolvedPaymentMode = "Cash";
      defaultNote = "Cash Order";
    }

    const userNotes = document.getElementById('order-notes') ? document.getElementById('order-notes').value.trim() : "";
    const finalNotes = userNotes ? (defaultNote ? defaultNote + " - " + userNotes : userNotes) : defaultNote;

    // 5. Calculate totals safely (grossTotal keeps actual cart value for all modes including Gift)
    const finalTotalStr = document.getElementById('final-val').innerText.replace(/[₹,]/g, '');
    const savingStr = document.getElementById('disc-val').innerText.replace(/[-₹,]/g, '');
    const totalSavings = parseFloat(savingStr) || 0;

    const summary = {
      customerId: currentUser.id,
      customerName: currentUser.name,
      customerEmail: currentUser.email,
      finalTotal: parseFloat(finalTotalStr) || 0,
      savingAmount: totalSavings,
      grossTotal: cart.reduce(function (sum, i) {return sum + (parseFloat(i.fullSubtotal) || 0);}, 0),
      notes: finalNotes
    };

    // 6. Send to backend finalizeOrderBulk
    google.script.run
      .withSuccessHandler(function (res) {

        if (res && res.success) {
          const idList = res.orderIds.join(", ");

          // Update user balance & credit from backend response
          if (typeof res.newCredit !== 'undefined') {
            currentUser.credit = parseFloat(res.newCredit) || 0;
          }
          if (typeof res.newBalance !== 'undefined') {
            currentUser.balance = parseFloat(res.newBalance) || 0;
            currentUser.advance = parseFloat(res.newBalance) || 0;
          }

          // Refresh Wallet UI across Header
          if (typeof updateWalletUI === 'function') {
            updateWalletUI(currentUser.credit, currentUser.balance);
          }

          // REMOVED: fetchAndUpdateUserWallet() call to avoid overwriting state with stale sheet data

          // Populate success modal
          const modalIdEl = document.getElementById('modal-id');
          modalSavingEl = document.getElementById('modal-saving');

          if (modalIdEl) {
            modalIdEl.innerHTML = "Order ID(s): <strong>" + idList + "</strong>";
          }

          if (modalSavingEl) {
            if (totalSavings > 0) {
              modalSavingEl.innerHTML = "You saved ₹" + totalSavings.toFixed(2) + " on this order!";
              modalSavingEl.style.display = "block";
            } else {
              modalSavingEl.style.display = "none";
            }
          }

          // Show Bootstrap Success Modal
          const successModalEl = document.getElementById('successModal');
          if (successModalEl) {
            const bsModal = new bootstrap.Modal(successModalEl);
            bsModal.show();
          }

          // Reset non-kitchen order flags
          isGiftOrder = false;
          isCashOrder = false;
          if (typeof vkPaymentMode !== 'undefined') vkPaymentMode = "";
          salesDiscountEnabled = false;

          // Check if logged-in user is Kitchen to determine default Kitchen state
          const isKitchenUser = currentUser && currentUser.name && currentUser.name.toLowerCase().includes("kitchen");
          isKitchenOrder = isKitchenUser;

          // Reset Cash and Gift switches
          ['cash-order-toggle', 'gift-order-toggle', 'cash-order-checkbox', 'gift-order-checkbox'].forEach(function (id) {
            const el = document.getElementById(id);
            if (el) el.checked = false;
          });

          // Set Kitchen switch to user default state
          const kitchenToggle = document.getElementById('kitchen-order-toggle') || document.getElementById('kitchen-order-checkbox');
          if (kitchenToggle) {
            kitchenToggle.checked = isKitchenUser;
          }

          // Clear notes input area
          const notesEl = document.getElementById('order-notes');
          if (notesEl) notesEl.value = "";

          // Reset cart arrays
          cart = [];
          pendingCartBackup = [];

          // Unlock Place Order Button
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = "Place Order";
          }

          // Refresh Cart UI with Updated Credit/Balance
          if (typeof updateCartUI === 'function') {
            updateCartUI();
          }

        } else {
          showAlert("Error placing order: " + (res ? res.error : "Unknown error"), "error");
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = "Place Order";
          }
        }
      })
      .withFailureHandler(function (err) {
        console.error("💥 [EXECUTE_ORDER_FATAL] Execution error:", err);
        showAlert("Backend connection error: " + err, "error");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = "Place Order";
        }
      })
      .finalizeOrderBulk(summary, cart, resolvedPaymentMode, null, txnId);

  }

  /* Update cart UI Starts*/
  function updateCartUI() {
    if (!currentUser) return;

    const isSales = (currentUser.varga === "Sales");
    const toggleContainer = document.getElementById('sales-toggle-container');

    // 1. Staff Controls Injection
    if (isSales && toggleContainer) {
      toggleContainer.style.display = 'block';
      toggleContainer.innerHTML = `
        <div class="card mb-3 border-0 shadow-sm" style="background: linear-gradient(145deg, #fffdf5, #fff9e6); border-left: 4px solid #ffc107 !important;">
            <div class="card-body p-2">
                <div class="d-flex align-items-center mb-2 text-warning">
                    <i class="material-icons" style="font-size:16px;">security</i>
                    <span class="fw-bold ms-1" style="font-size:0.65rem; letter-spacing:1px; text-transform:uppercase;">Staff Controls</span>
                </div>
                <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" id="kitchen-toggle" 
                           ${isKitchenOrder ? 'checked' : ''} onchange="toggleKitchenOrder(this)">
                    <label class="form-check-label small fw-bold" for="kitchen-toggle">Kitchen Order</label>
                </div>
                <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" id="cash-toggle" 
                           ${isCashOrder ? 'checked' : ''} onchange="toggleCashOrder(this)">
                    <label class="form-check-label small text-primary fw-bold" for="cash-toggle">Cash Order</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="gift-toggle" 
                           ${isGiftOrder ? 'checked' : ''} onchange="toggleGiftOrder(this)">
                    <label class="form-check-label small text-success fw-bold" for="gift-toggle">Vidyakshetra Gift</label>
                </div>
            </div>
        </div>`;
    } else if (toggleContainer) {
      toggleContainer.style.display = 'none';
      toggleContainer.innerHTML = '';
    }

    if (!isSales) {
      isKitchenOrder = false;
      isGiftOrder = false;
    }

    const list = document.getElementById('cart-list');
    const btn = document.getElementById('place-order-btn');
    const gate = document.getElementById('payment-gate');

    // 2. Accounting Values (Col J = Dues, Col I = Credit)
    const userDues = parseFloat(currentUser.balance || 0);   // Always positive Dues
    const userCredit = parseFloat(currentUser.credit || 0);  // Always positive Wallet Credit

    const balEl = document.getElementById('balance-val');
    const creEl = document.getElementById('credit-val');

    if (balEl) balEl.innerText = "₹" + userDues.toFixed(2);
    if (creEl) creEl.innerText = "₹" + userCredit.toFixed(2);

    let gross = 0;
    let cartHtml = "";

    // 3. Empty Cart Check
    if (cart.length === 0) {
      if (list) list.innerHTML = '<div class="text-muted small text-center py-3">Your cart is empty</div>';
      const gVal = document.getElementById('gross-val');
      const dVal = document.getElementById('disc-val');
      const rVal = document.getElementById('round-val');
      const fVal = document.getElementById('final-val');

      if (gVal) gVal.innerText = "₹0.00";
      if (dVal) dVal.innerText = "-₹0.00";
      if (rVal) rVal.innerText = "₹0.00";

      // Net payable without items is simply outstanding dues minus credit
      let netPayable = Math.max(0, userDues - userCredit);
      if (fVal) fVal.innerText = "₹" + netPayable.toFixed(2);

      if (btn) {btn.classList.add('disabled'); btn.disabled = true;}
      if (gate) gate.style.display = 'none';
      return;
    }

    // 4. Cart Items Generation
    const grouped = cart.reduce((acc, item) => {
      if (!acc[item.mainCategory]) acc[item.mainCategory] = [];
      acc[item.mainCategory].push(item);
      return acc;
    }, {});

    for (const cat in grouped) {
      cartHtml += `
          <div class="category-divider d-flex align-items-center my-2">
              <span class="fw-bold small text-uppercase" style="color:var(--vg-brown); letter-spacing:1px;">${cat}</span>
              <div class="flex-grow-1 ms-2" style="border-bottom: 1px dashed #ccc;"></div>
          </div>`;

      cartHtml += grouped[cat].map(i => {
        const subtotalNum = parseFloat(i.fullSubtotal);
        gross += subtotalNum;
        return `
              <div class="cart-item d-flex justify-content-between align-items-center py-1 mb-1">
                  <div style="flex: 1; min-width: 0;">
                      <div class="fw-bold text-truncate" style="font-size:0.8rem">${i.itemName}</div>
                      <small class="text-muted" style="font-size:0.7rem">₹${parseFloat(i.salePrice).toFixed(2)} / ${i.uom}</small>
                  </div>
                  <div class="d-flex align-items-center">
                      <div class="input-group input-group-sm me-2" style="width: 80px;">
                          <button class="btn btn-outline-secondary px-1 py-0" onclick="changeCartQty('${i.sku}', -1)">-</button>
                          <span class="form-control text-center p-0 d-flex align-items-center justify-content-center" style="font-size: 0.7rem; min-height:24px;">${i.quantity}</span>
                          <button class="btn btn-outline-secondary px-1 py-0" onclick="changeCartQty('${i.sku}', 1)">+</button>
                      </div>
                      <div class="text-end" style="min-width: 55px;"><span class="fw-bold" style="font-size:0.8rem">₹${subtotalNum.toFixed(2)}</span></div>
                      <i class="material-icons ms-2 remove-btn" style="font-size:16px; cursor:pointer; color:#dc3545;" onclick="removeFromCart(${i.cartId})">cancel</i>
                  </div>
              </div>`;
      }).join('');
    }

    if (list) list.innerHTML = cartHtml;

    // 5. Calculate Discount & Round-Off (Nearest Whole Rupee ₹1.00)
    let discAmt = 0;
    const userDiscountPct = parseFloat(currentUser.discount || 0);
    if (userDiscountPct > 0) {
      discAmt = gross * (userDiscountPct / 100);
    }

    const unroundedItemCharge = Math.max(0, gross - discAmt);

    // Round to nearest whole integer
    const roundedItemCharge = Math.round(unroundedItemCharge);
    const roundOffAmt = roundedItemCharge - unroundedItemCharge;

    // Total Bill = (Rounded Item Charge + Previous Dues) - Wallet Credit
    const finalTotal = (roundedItemCharge + userDues) - userCredit;
    const displayTotal = finalTotal > 0 ? finalTotal : 0;

    const gVal = document.getElementById('gross-val');
    const dVal = document.getElementById('disc-val');

    // Look for the Round Off element using fallback IDs
    const rVal = document.getElementById('round-val');
    const fVal = document.getElementById('final-val');

    if (gVal) gVal.innerText = "₹" + gross.toFixed(2);
    if (dVal) dVal.innerText = "-₹" + discAmt.toFixed(2);

    if (rVal) {
      const sign = roundOffAmt > 0 ? "+" : "";
      rVal.innerText = sign + "₹" + roundOffAmt.toFixed(2);
    }

    if (fVal) fVal.innerText = "₹" + displayTotal.toFixed(2);

    // 6. Payment UI Actions
    if (gate) {
      gate.style.display = 'block';
      const payLabel = document.getElementById('pay-amt-label');
      if (payLabel) payLabel.innerText = "₹" + displayTotal.toFixed(2);
      if (typeof updatePaymentButtons === "function") {
        updatePaymentButtons(isSales, displayTotal);
      }
    }

    // 7. Button Enable/Disable
    if (btn) {
      if (cart.length > 0) {
        btn.classList.remove('disabled');
        btn.disabled = false;
        btn.style.setProperty("background-color", "var(--vg-brown)", "important");
        btn.style.pointerEvents = 'auto';
        btn.style.opacity = '1';
      } else {
        btn.classList.add('disabled');
        btn.disabled = true;
        btn.style.opacity = '0.5';
      }
    }
  }

  /*Update cart UI ends*/

  /* Staff Control Toggle Handlers */
  function toggleCashOrder(el) {
    isCashOrder = el.checked;
    if (isCashOrder) {
      isKitchenOrder = false;
      isGiftOrder = false;
      const kitchenEl = document.getElementById('kitchen-toggle');
      const giftEl = document.getElementById('gift-toggle');
      if (kitchenEl) kitchenEl.checked = false;
      if (giftEl) giftEl.checked = false;
    }
    updateCartUI();
  }

  // Ensure toggle handlers deselect cash when others are picked:
  function toggleKitchenOrder(el) {
    isKitchenOrder = el.checked;
    if (isKitchenOrder) {
      isGiftOrder = false;
      isCashOrder = false;
      const giftEl = document.getElementById('gift-toggle');
      const cashEl = document.getElementById('cash-toggle');
      if (giftEl) giftEl.checked = false;
      if (cashEl) cashEl.checked = false;
    }
    updateCartUI();
  }

  function toggleGiftOrder(el) {
    isGiftOrder = el.checked;
    if (isGiftOrder) {
      isKitchenOrder = false;
      isCashOrder = false;
      const kitchenEl = document.getElementById('kitchen-toggle');
      const cashEl = document.getElementById('cash-toggle');
      if (kitchenEl) kitchenEl.checked = false;
      if (cashEl) cashEl.checked = false;
    }
    updateCartUI();
  }
  // State & Timer Variables
  /**
   * 1. RENDER PAYMENT ACTION BUTTONS
   */
  function updatePaymentButtons(isSales, amount) {
    const container = document.getElementById('payment-action-container');
    if (!container) return;

    // Option A: Kitchen or Gift Order Action
    if (isKitchenOrder || isGiftOrder) {
      const modeLabel = isGiftOrder ? "Vidyakshetra Gift" : "Kitchen Order";
      vkPaymentMode = isGiftOrder ? "Gift" : "Kitchen";

      container.innerHTML = `
        <div class="alert alert-warning text-center my-2 p-2 small">
          <strong>${modeLabel} Selected</strong><br>
          Bypasses payment verification.
        </div>
        <button class="btn btn-warning w-100 fw-bold py-2 shadow-sm" onclick="startOrderProcess()">
          PLACE ${modeLabel.toUpperCase()}
        </button>`;
      return;
    }

    // Option B: Standard Sales User Action
    if (isSales && amount > 0) {
      vkPaymentMode = null; // Will be set dynamically by chosen action
      container.innerHTML = `
        <div class="d-flex flex-column mt-3">
          <p class="text-center mb-2 fw-bold" style="font-size:0.65rem; letter-spacing:1.5px; color: var(--vg-brown); opacity: 0.7;">
            SELECT PAYMENT METHOD
          </p>
          
          <button class="btn btn-success w-100 mb-2 p-0 overflow-hidden" style="min-height: 50px; display: flex;" onclick="showCashConfirmation(${amount})">
            <div class="d-flex align-items-center justify-content-center bg-black-20 px-3">
              <i class="material-icons text-white">payments</i>
            </div>
            <div class="d-flex flex-column justify-content-center text-start ps-3 py-2">
              <span class="fw-bold text-white" style="font-size:0.9rem; line-height: 1.1;">Physical Cash</span>
              <span class="text-white-50" style="font-size:0.65rem;">Direct cash collection</span>
            </div>
          </button>

          <div class="text-center position-relative my-1">
            <hr class="m-0" style="border-color: var(--vg-brown); opacity: 0.1;">
            <span class="position-absolute top-50 start-50 translate-middle px-3" 
                  style="font-size:0.6rem; background: var(--vg-cream); color: var(--vg-brown); font-weight: bold;">OR</span>
          </div>

          <button class="btn btn-primary w-100 mb-2 p-0 overflow-hidden" style="min-height: 50px; display: flex;" onclick="initiateUpiOrder()">
            <div class="d-flex align-items-center justify-content-center bg-black-20 px-3">
              <i class="material-icons text-white">qr_code_scanner</i>
            </div>
            <div class="d-flex flex-column justify-content-center text-start ps-3 py-2">
              <span class="fw-bold text-white" style="font-size:0.9rem; line-height: 1.1;">UPI Online Payment</span>
              <span class="text-white-50" style="font-size:0.65rem;">Digital Scan & Verify</span>
            </div>
          </button>
        </div>`;
    } else if (amount > 0) {
      vkPaymentMode = "UPI";
      container.innerHTML = `
        <button class="btn btn-primary btn-sm w-100 mb-2" onclick="startOrderProcess()">
          Pay Now ₹${amount.toFixed(2)}
        </button>`;
    }
  }

  /**
   * Helper to trigger UPI explicitly
   */
  function initiateUpiOrder() {
    vkPaymentMode = "UPI";
    startOrderProcess();
  }

  /**
   * 2. CASH CONFIRMATION MODAL & HANDLERS
   */
  function showCashConfirmation(amount) {
    const modalElement = document.getElementById('payment-modal');

    if (!paymentModalObj) {
      paymentModalObj = new bootstrap.Modal(modalElement);
    }

    const cashSection = document.getElementById('cash-confirm-section');
    if (cashSection) {
      cashSection.innerHTML = `
              <div class="text-center p-4">
                  <i class="material-icons text-success mb-3" style="font-size:4rem;">check_circle</i>
                  <h4 class="fw-bold">Cash Collection</h4>
                  <p class="text-muted">Receive <span class="fw-bold text-dark">₹${amount.toFixed(2)}</span> from member</p>
                  <button class="btn btn-success w-100 py-3 mt-2 shadow fw-bold" onclick="processCashOrder()">
                      CONFIRM & PLACE ORDER
                  </button>
                  <button class="btn btn-link text-muted mt-2 btn-sm" data-bs-dismiss="modal">Cancel</button>
              </div>`;
    }

    paymentModalObj.show();
  }

  function processCashOrder() {
    // Hide modal
    if (paymentModalObj) {
      paymentModalObj.hide();
    }

    // Set payment mode and route through standard pipeline
    vkPaymentMode = "Cash";
    startOrderProcess();
  }


  /**Wallet code***/
  function updateWalletUI(credit, balance) {
    const creditVal = parseFloat(credit) || 0;
    const duesVal = parseFloat(balance) || 0;

    // Option A: Updating individual spans
    const creditEl = document.getElementById('header-credit-val');
    const duesEl = document.getElementById('header-dues-val');

    if (creditEl) creditEl.innerText = `₹${creditVal.toFixed(2)}`;
    if (duesEl) duesEl.innerText = `₹${duesVal.toFixed(2)}`;

    // Option B: If your function overwrites innerHTML dynamically:
    const walletBadge = document.getElementById('wallet-badge-container');
    if (walletBadge) {
      walletBadge.innerHTML = `
      <span class="text-success fw-bold">
        ➕ Credit: ₹${creditVal.toFixed(2)}
      </span>
      <span class="text-muted">|</span>
      <span class="text-danger fw-bold">
        ➖ Dues: ₹${duesVal.toFixed(2)}
      </span>
    `;
    }
  }

  /**
   * Fetches the user's latest balance & credit from Google Apps Script.
   * Calculates Net Wallet Power = Credit + Balance (where balance can be negative).
   */
  function fetchAndUpdateUserWallet() {
    if (!currentUser || !currentUser.id) return;

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          const credit = parseFloat(res.credit) || 0;
          const balance = parseFloat(res.balance) || 0;

          // Update the visual UI with fresh sheet data
          updateWalletUI(credit, balance);

          // Keep local state in sync
          currentUser.credit = credit;
          currentUser.balance = balance;
        } else {
          console.error("Wallet Fetch Error:", res ? res.error : "Unknown error");
        }
      })
      .withFailureHandler(err => {
        console.error("Failed to run getUserWalletData:", err);
      })
      .getUserWalletData(currentUser.id);
  }

</script>
